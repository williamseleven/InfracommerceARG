name: update-data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnostico - archivos del repo
        run: |
          echo "== Archivos =="
          ls -la
          echo "== scripts =="
          ls -la scripts || echo "FALTA scripts/"

      - name: Generar data.json
        run: python scripts/build_data.py

      - name: Commit si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "data: actualizacion automatica $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
