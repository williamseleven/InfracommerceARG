name: Actualizar Torre de Despacho

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 12 * * 1'   # semanal: dispara el keepalive
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar el tablero (descarga CSV + procesa)
        run: python scripts/build_data.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Evita que GitHub desactive el workflow tras 60 días sin commits.
  # Corre una vez por semana y llama a la API de GitHub (sin acciones de terceros ni commits).
  keepalive:
    if: github.event.schedule == '17 12 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Mantener activo el workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"
